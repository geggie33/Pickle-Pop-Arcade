workflows:
  ios-workflow:
    name: Pickle Pop Arcade iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web app
        script: |
          npm run build

      - name: Add iOS platform
        script: |
          npx cap add ios
          npx cap sync ios

      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            archive \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive

    artifacts:
      - build/**
