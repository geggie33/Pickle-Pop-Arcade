workflows:
  ios-workflow:
    name: Pickle Pop Arcade iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Pickle Pop

    environment:
      ios_signing:
        
        
              provisioning_profiles: ["Pickle Pop App Store Final"]
          
              certificates: ["Pickle Pop Distributions"]
          
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web app
        script: |
          npm run build

      
      - name: Add iOS platform
        script: |
          npx cap add ios
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile
          npx cap sync ios
              sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Set iOS build number
        script: |
          cd ios/App
          agvtool new-version -all 6
          

      - name: Set up code signing
        script: |
          
          xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
                

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log       
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
